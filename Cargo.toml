[package]
name = "zetta"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "zetta"

[features]
default = ["wayland", "serial-console", "http-server", "tftp-server", "tftp-client", "notifications", "clipboard", "syntax-highlighting", "session-persistence", "worktree"]
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
windows-gui = []
syntax-highlighting = [
    "rust-embed/include-exclude",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-diff",
    "dep:tree-sitter-gitcommit",
    "dep:tree-sitter-go",
    "dep:tree-sitter-go-mod",
    "dep:tree-sitter-gowork",
    "dep:tree-sitter-jsdoc",
    "dep:tree-sitter-json",
    "dep:tree-sitter-make",
    "dep:tree-sitter-md",
    "dep:tree-sitter-python",
    "dep:tree-sitter-regex",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-batch",
]
session-persistence = ["zmux/session-persistence"]
serial-console = ["dep:serialport"]
http-server = []
tftp-server = []
tftp-client = []
notifications = ["dep:notify-rust", "dep:cpal", "dep:mac-usernotifications", "dep:ashpd"]
clipboard = ["dep:arboard"]
worktree = ["dep:zwt", "zwt/recursive-submodules"]

[[bin]]
name = "zetta-gui"
path = "src/bin/zetta_gui.rs"
required-features = ["windows-gui"]

# The multiplexer ships as its own executable so a session outlives every Zetta
# process. This target exists here so the normal build produces it alongside
# `zetta`; `crates/zmux` also builds standalone, which is how a stripped-down
# daemon is produced for a constrained host.
[[bin]]
name = "zmux"
path = "src/bin/zmux.rs"

[[bin]]
name = "zwt"
path = "src/bin/zwt.rs"
required-features = ["worktree"]

[[bin]]
name = "zmux-pty"
path = "src/bin/zmux_pty.rs"

[dependencies]
anyhow = "1"
async-channel = "2.5.0"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }
argon2 = "0.5"
busy-v = { path = "busy-v" }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
log = "0.4"
async-compression = { version = "0.4", features = ["gzip", "futures-io"] }
async-tar = "0.6"
assets = { path = "zed/crates/assets" }
futures = "0.3"
getrandom = "0.3"
gpui = { path = "zed/crates/gpui", features = ["profiler"] }
gpui_platform = { path = "crates/gpui_platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "tiff",
    "webp",
] }
menu = { path = "zed/crates/menu" }
notify-rust = { version = "4", features = ["preview-macos-un"], optional = true }
release_channel = { path = "zed/crates/release_channel" }
reqwest_client = { path = "zed/crates/reqwest_client" }
rust-embed = "8"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
smallvec = "1"
subtle = "2"
sysinfo = "0.37"
regex = "1.11"
strum = "0.28"
serialport = { version = "4.9", default-features = false, optional = true }
settings = { path = "zed/crates/settings" }
task = { path = "zed/crates/task" }
terminal = { path = "crates/terminal" }
terminal_view = { path = "crates/terminal_view" }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
theme = { path = "zed/crates/theme" }
theme_settings = { path = "zed/crates/theme_settings" }
toml = "0.8"
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.1", optional = true }
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-diff = { version = "0.1.0", optional = true }
tree-sitter-gitcommit = { git = "https://github.com/zed-industries/tree-sitter-git-commit", rev = "88309716a69dd13ab83443721ba6e0b491d37ee9", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-go-mod = { git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a", package = "tree-sitter-gomod", optional = true }
tree-sitter-gowork = { git = "https://github.com/zed-industries/tree-sitter-go-work", rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7", optional = true }
tree-sitter-jsdoc = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-make = { version = "1.1.1", optional = true }
tree-sitter-md = { git = "https://github.com/zed-industries/tree-sitter-markdown", rev = "b596e737286780d7bfa9fcddceaeeb754574b352", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-regex = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-batch = { version = "0.11", optional = true }
tree-sitter-highlight = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18", optional = true }
ui = { path = "zed/crates/ui" }
util = { path = "zed/crates/util" }
zeroize = "1"
zed_actions = { path = "zed/crates/zed_actions" }
zmux = { path = "crates/zmux", default-features = false, features = ["scrollback-buffer"] }
zwt = { path = "crates/zwt", optional = true }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-registry = "0.5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[target.'cfg(not(target_os = "macos"))'.dependencies]
cpal = { version = "0.16", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification"], optional = true }
url = "2.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.17", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
mac-usernotifications = { version = "0.3.1", features = ["blocking-wrappers"], optional = true }
url = "2.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["block2", "NSApplication", "NSEvent", "NSMenu"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject", "NSValue"] }
objc2-intents = { version = "0.3", default-features = false, features = ["INFocusStatus", "INFocusStatusCenter", "block2"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Already in the graph through zmux; a dev-dependency here so tests can generate
# a throwaway key pair to seal a session key to.
age = { version = "0.11.1", default-features = false, features = ["armor", "ssh"] }
gpui = { path = "zed/crates/gpui", features = ["test-support"] }

# Pedantic lints the tree is already clean of, denied so they cannot creep back
# in one call site at a time. Deliberately not adopted, with the reason:
#
# - `needless_pass_by_value`: GPUI closures own what they capture, so most of
#   its ~80 sites would trade a move for a borrow plus a clone.
# - `redundant_closure_for_method_calls`: turns readable closures into path
#   expressions (`|poisoned| poisoned.into_inner()` becomes
#   `std::sync::PoisonError::into_inner`).
# - `unnecessary_wraps`: `startup/cli_modes.rs` and the CLI services return
#   `Result<()>` because their dispatch table does, not because they can fail.
# - `match_same_arms`: merging arms that happen to agree today hides which
#   variant is which, and this tree leans on exhaustive matches to route.
# - `redundant_clone`: mostly builder chains where the clone is what keeps the
#   value alive for a later call in the same expression.
[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"

[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev]
debug = 1
incremental = true
codegen-units = 16

[profile.release]
incremental = false
# LLVM partitions have produced missing hidden symbols during the final link.
# Keep a single codegen unit for the optimized build.
codegen-units = 1
strip = "symbols"
