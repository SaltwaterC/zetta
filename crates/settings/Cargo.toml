[package]
name = "settings"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/settings.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "fs/test-support"]

[dependencies]
anyhow = "1.0.86"
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
ec4rs = { version = "1.2", features = ["allow-empty-values"] }
fs = { path = "../fs" }
futures = "0.3.32"
gpui = { path = "../gpui", default-features = false }
inventory = "0.3.19"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
migrator = { path = "../migrator" }
paths = { path = "../../zed/crates/paths" }
release_channel = { path = "../release_channel" }
rust-embed = { version = "8.11", features = ["include-exclude"] }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
settings_content = { path = "../settings_content" }
settings_json = { path = "../../zed/crates/settings_json", default-features = false, features = ["editing"] }
settings_macros = { path = "../../zed/crates/settings_macros" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
util = { path = "../../zed/crates/util" }
zlog = { path = "../../zed/crates/zlog" }

[dev-dependencies]
fs = { path = "../fs", features = ["test-support"] }
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }

indoc = "2"
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
unindent = "0.2.0"
