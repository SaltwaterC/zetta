[package]
name = "zetta_sync"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Poison-tolerant locking shared by Zetta's crates"

[lib]
path = "src/lib.rs"
doctest = false

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
