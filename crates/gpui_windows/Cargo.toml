[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_windows.rs"
doctest = false

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "scap"]

[dependencies]
gpui = { path = "../gpui", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_windows = "0.34"
anyhow = "1.0.86"
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
dunce = "1.0"
etagere = "0.2"
futures = "0.3.34"
gpui_util = { path = "../../zed/crates/gpui_util" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
itertools = "0.14.0"
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
scheduler = { path = "../../zed/crates/scheduler" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
uuid = { version = "1.1", features = ["serde", "v5"] }
windows-core = "0.62"
windows-numerics = "0.3"
windows-registry = "0.6.0"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
# Zetta keeps the full feature set its 0.61 manifest resolved from Zed's
# workspace: outside that workspace no other crate unifies features into it.
features = [
    "Data_Xml_Dom",
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_Notifications",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
    "Win32_System_StationsAndDesktops",
]

[target.'cfg(target_os = "windows")'.dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"
optional = true

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-registry = "0.6.0"

[package.metadata.cargo-shear]
ignored = ["scap"]
