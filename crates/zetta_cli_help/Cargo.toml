[package]
name = "zetta_cli_help"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "The help-table formatter and repeated-option checks shared by every Zetta command-line interface"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1"

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
