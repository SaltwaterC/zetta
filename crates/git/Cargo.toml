[package]
name = "git"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/git.rs"

[features]
test-support = ["rand", "gpui/test-support"]

[dependencies]
anyhow = "1.0.86"
askpass = { path = "../askpass" }
async-trait = "0.1"
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
gpui = { path = "../gpui", default-features = false }
http_client = { path = "../../zed/crates/http_client" }
itertools = "0.14.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
regex = "1.5"
rand = { version = "0.9", optional = true }
rope = { path = "../rope" }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = "2.5.0"
smol = "2.0"
sum_tree = { path = "../../zed/crates/sum_tree" }
text = { path = "../text" }
thiserror = "2.0.12"
time = { version = "0.3", features = ["macros", "parsing", "serde", "serde-well-known", "formatting", "local-offset"] }
url = "2.2"
urlencoding = "2.1.2"
util = { path = "../../zed/crates/util" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
futures = "0.3.32"
ztracing = { path = "../../zed/crates/ztracing" }

[dev-dependencies]
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
text = { path = "../text", features = ["test-support"] }
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
tempfile = "3.20.0"
rand = "0.9"
