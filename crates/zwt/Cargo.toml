[package]
name = "zwt"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Git worktree workflow for Zetta"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "zwt"
path = "src/main.rs"

[features]
default = ["recursive-submodules"]
recursive-submodules = []

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zmux = { path = "../zmux", default-features = false }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"
