[package]
name = "zwt"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Git worktree workflow for Zetta"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "zwt"
path = "src/main.rs"

[features]
default = ["recursive-submodules"]
recursive-submodules = []

[dependencies]
zetta_cli_help = { path = "../zetta_cli_help" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
zmux = { path = "../zmux", default-features = false }

[target.'cfg(unix)'.dependencies]
# Already in the graph at this version; the safe spelling of `statfs` and
# `FICLONE`.
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
