[package]
name = "zetta_layout"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "The pane-layout tree algebra shared by Zetta and its multiplexer"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
