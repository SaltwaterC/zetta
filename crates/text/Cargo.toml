[package]
name = "text"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/text.rs"
doctest = false

[features]
test-support = ["rand", "util/test-support"]

[dependencies]
anyhow = "1.0.86"
clock = { path = "../../zed/crates/clock" }
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
rand = { version = "0.9", optional = true }
regex = "1.5"
rope = { path = "../rope" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
sum_tree = { path = "../../zed/crates/sum_tree" }
util = { path = "../../zed/crates/util" }

[dev-dependencies]
collections = { version = "0.1.0", path = "../../zed/crates/collections", features = ["test-support"] }
ctor = "1.0.12"
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
rand = "0.9"
util = { path = "../../zed/crates/util", features = ["test-support"] }
zlog = { path = "../../zed/crates/zlog" }
