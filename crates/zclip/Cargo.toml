[package]
name = "zclip"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
default = ["backend"]
backend = ["dep:arboard"]

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[[bin]]
name = "zcopy"
path = "src/bin/zcopy.rs"

[[bin]]
name = "zpaste"
path = "src/bin/zpaste.rs"
