[package]
name = "fs"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/fs.rs"
test = false

[[test]]
name = "integration"
required-features = ["test-support"]
path = "tests/integration/fs_tests.rs"

[dependencies]
anyhow = "1.0.86"
async-channel = "2.5.0"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-trait = "0.1"
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
futures = "0.3.32"
git = { path = "../git" }
gpui = { path = "../gpui", default-features = false }
ignore = "0.4.22"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
paths = { path = "../../zed/crates/paths" }
rope = { path = "../rope" }
proto = { path = "../../zed/crates/proto" }
thiserror = "2.0.12"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smol = "2.0"
telemetry = { path = "../../zed/crates/telemetry" }
tempfile = "3.20.0"
text = { path = "../text" }
util = { path = "../../zed/crates/util" }
path = { path = "../../zed/crates/path" }
is_executable = "1.0.5"
notify = "9.0.0-rc.4"
trash = { git = "https://github.com/zed-industries/trash-rs", rev = "41c6c800d884a89351f3b8856d12894cccee261d" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }
dunce = "1.0"
async-std = { version = "1.12", features = ["unstable"] }

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[package.metadata.cargo-shear]
ignored = ["async-std"]

[dev-dependencies]
fs = { path = "../fs", features = ["test-support"] }
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
git = { path = "../git", features = ["test-support"] }

[features]
test-support = ["gpui/test-support", "git/test-support", "util/test-support"]
