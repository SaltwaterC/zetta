[package]
name = "gpui_web"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
autoexamples = false

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lib]
path = "src/gpui_web.rs"
doctest = false

[dependencies]
unicode-properties = "=0.1.3"
unicode-script = "0.5.7"
unicode-segmentation = "1.10"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { path = "../gpui", default-features = false }
scheduler = { path = "../../zed/crates/scheduler" }
parking_lot = { version = "0.12.1", features = ["nightly"] }
gpui_wgpu = { path = "../gpui_wgpu" }
http_client = { path = "../../zed/crates/http_client" }
anyhow = "1.0.86"
async-channel = { version = "2.5", default-features = false }
futures = "0.3.34"
log = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1.1", features = ["serde"] }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
wasm_thread = { version = "0.3", git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"], optional = true }
web-sys = { version = "0.3", features = ["Blob", "Clipboard", "ClipboardEvent", "ClipboardItem", "CompositionEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DragEvent", "Element", "EventTarget", "File", "FocusOptions", "Headers", "HtmlCanvasElement", "HtmlElement", "HtmlTextAreaElement", "IdleDeadline", "IdleRequestOptions", "ImageData", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Navigator", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "PointerEvent", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult", "Request", "RequestCredentials", "RequestInit", "RequestRedirect", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverSize", "Response", "Screen", "Storage", "TextMetrics", "VisualViewport", "WheelEvent", "Window", "console"] }

[dev-dependencies]
anyhow = "1.0.86"
gpui = { path = "../gpui", default-features = false }
smallvec = { version = "1.6", features = ["union", "const_new"] }

[package.metadata.cargo-shear]
ignored = ["scheduler"]
