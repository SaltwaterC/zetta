[package]
name = "gpui_apple"
# Distinguish this fork from upstream when Cargo reconstructs path lock entries.
version = "0.1.0-zetta"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/gpui_apple.rs"
doctest = false

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit", "dep:core-text", "dep:objc2-core-text", "dep:pathfinder_geometry"]

[dependencies]
gpui = { path = "../gpui", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
anyhow = "1.0.86"
async-task = "4.7"
block2 = "0.6"
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = { version = "21", optional = true }
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
etagere = "0.2"
foreign-types = "0.5"
futures = "0.3.34"
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", default-features = false, features = ["source"], optional = true }
gpui_util = { path = "../../zed/crates/gpui_util" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
metal = "0.33"
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFBase", "CFData", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"], optional = true }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVPixelBuffer", "CVReturn", "objc2", "objc2-metal"] }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice", "MTLPixelFormat", "MTLTexture"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSOperation", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSThread", "NSURL", "NSValue", "block2", "objc2-core-foundation", "std"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
parking_lot = "0.12.1"
pathfinder_geometry = { version = "0.5", optional = true }
smallvec = { version = "1.6", features = ["union", "const_new"] }
thiserror = "2.0.12"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer"] }
