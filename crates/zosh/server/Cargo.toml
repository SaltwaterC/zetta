[package]
name = "zosh-server-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Cross-platform Rust zosh-server implementation for Linux, macOS, and Windows"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "zosh-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
portable-pty = "0.9"
vt100 = "0.16.2"
zclip = { path = "../../zclip", default-features = false }

moshcatty = { path = "../../moshcatty" }

[patch.crates-io]
vt100 = { path = "../../vt100" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Holds the systemd-logind sleep inhibitor; see sleep_guard.rs.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.17", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
