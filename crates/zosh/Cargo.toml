[package]
name = "zosh"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Cross-platform Mosh terminal client for Zetta"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "zosh"
path = "src/main.rs"

[dependencies]
zetta_sync = { path = "../zetta_sync" }
anyhow = "1"
# The scrollback rows the server carries ride inside an OSC string, so they
# are Base64 there; see PROTOCOL.md.
base64 = "0.22"
crossterm = "0.29"
mosh-rs = { path = "../mosh_rs" }
shlex = "1.3.0"
zclip = { path = "../zclip", default-features = false }

# Resize replay normalizes carried history to the final display width. This
# is the same parser already used by mosh-rs for the protocol screen.
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Already in the graph at this version; the safe spelling of the terminal and
# peer-credential calls.
rustix = { version = "1.1.4", features = ["net", "process", "termios"] }
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[patch.crates-io]
vt100 = { path = "../vt100" }

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
