[package]
name = "zosh"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Cross-platform Mosh terminal client for Zetta"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1"
# The scrollback rows the server carries ride inside an OSC string, so they
# are Base64 there; see PROTOCOL.md.
base64 = "0.22"
crossterm = "0.29"
mosh-rs = { path = "../mosh_rs" }
shlex = "1.3.0"

[dev-dependencies]
# The display tests model a real terminal's history: they drive both halves of
# the scrollback extension and then read what the rows actually landed in.
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4.4"

[patch.crates-io]
vt100 = { path = "../vt100" }
