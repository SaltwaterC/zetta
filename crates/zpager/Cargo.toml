[package]
name = "zpager"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Terminal pager for Git diff output"

[lib]
doctest = false

[[bin]]
name = "zpager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
