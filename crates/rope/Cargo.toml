[package]
name = "rope"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Resolved from `zed/Cargo.toml`'s `[workspace.lints]`, which a fork outside
# that workspace cannot inherit. Keep it in step when syncing.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/rope.rs"

[dependencies]
heapless = "0.9.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
rayon = "1.8"
sum_tree = { path = "../../zed/crates/sum_tree" }
unicode-segmentation = "1.10"
util = { path = "../../zed/crates/util" }
ztracing = { path = "../../zed/crates/ztracing" }
tracing = "0.1.40"

[dev-dependencies]
ctor = "1.0.12"
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
rand = "0.9"
util = { path = "../../zed/crates/util", features = ["test-support"] }
criterion = { version = "0.5", features = ["html_reports"] }
zlog = { path = "../../zed/crates/zlog" }

[[bench]]
name = "rope_benchmark"
harness = false

[package.metadata.cargo-shear]
ignored = ["tracing"]
