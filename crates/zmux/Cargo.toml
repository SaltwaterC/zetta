[package]
name = "zmux"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Session multiplexer for Zetta: owns background terminal sessions"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "zmux"
path = "src/main.rs"

[[bin]]
name = "zmux-pty"
path = "src/bin/zmux_pty.rs"

[features]
default = ["scrollback-buffer", "session-persistence"]
# Retains a bounded in-memory ring buffer of a detached pane's output, and the
# snapshot exchange that makes a reattach look like the screen never went away.
# Compiled out for memory-constrained targets that only need the session to stay
# alive.
scrollback-buffer = []
# Encrypts detached-session state with age v1 files.
session-persistence = [
    "scrollback-buffer",
    "dep:age",
    "dep:age-core",
    "dep:base64",
    "dep:hpke",
    "dep:reqwest",
]
# Exposes the hooks integration tests need to drive situations a real client
# cannot easily produce, such as a window dying mid-attach.
test-support = []

[dependencies]
age = { version = "0.11.1", default-features = false, features = ["armor", "ssh"], optional = true }
age-core = { version = "0.11.0", optional = true }
alacritty_terminal = { path = "../alacritty_terminal", default-features = false, features = ["serde"] }
anyhow = "1"
argon2 = "0.5"
async-channel = "2.5.0"
base64 = { version = "0.21", optional = true }
getrandom = { version = "0.3", features = ["std"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "hkdfsha2", "mlkem", "x25519"], optional = true }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
signal-hook = "0.4.3"
subtle = "2"
sysinfo = "0.37"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tempfile = "3"

[dev-dependencies]
tempfile = "3"
zmux = { path = ".", features = ["test-support"] }
