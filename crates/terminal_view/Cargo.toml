[package]
name = "terminal_view"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/standalone.rs"
doctest = false

[dependencies]
gpui = { path = "../gpui", default-features = false }
itertools = "0.14.0"
libc = "0.2"
regex = "1.11"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive"] }
settings_content = { path = "../settings_content" }
sysinfo = "0.37"
terminal = { path = "../terminal" }
tempfile = "3"
theme = { path = "../theme" }
theme_settings = { path = "../theme_settings" }
ui = { path = "../ui" }
util = { path = "../../zed/crates/util" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
