[package]
name = "gpui_macos"
# Distinguish this fork from upstream when Cargo reconstructs path lock entries.
version = "0.1.0-zetta"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = "allow"

[lib]
path = "src/gpui_macos.rs"
doctest = false

[features]
default = ["gpui/default"]
bench-support = ["gpui/bench-support", "gpui_apple/bench-support"]
test-support = ["gpui/test-support", "gpui_apple/test-support"]
runtime_shaders = ["gpui_apple/runtime_shaders"]
font-kit = ["gpui_apple/font-kit"]
screen-capture = ["gpui/screen-capture", "dep:objc2-core-graphics", "dep:objc2-core-media", "dep:objc2-screen-capture-kit"]

[dependencies]
gpui = { path = "../gpui", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
block2 = "0.6"
cocoa = "=0.26.0"
collections = { version = "0.1.0", path = "../../zed/crates/collections" }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
ctor = "1.0.12"
dispatch2 = { version = "0.3", default-features = false, features = ["block2", "objc2", "std"] }
foreign-types = "0.5"
futures = "0.3.34"
gpui_apple = { path = "../gpui_apple" }
gpui_util = { path = "../../zed/crates/gpui_util" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
itertools = "0.14.0"
log = { version = "0.4", default-features = false, features = ["std"] }
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSDraggingItem", "NSEvent", "NSGraphics", "NSImage", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSSavePanel", "NSScreen", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay"], optional = true }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMSampleBuffer", "objc2-core-video"], optional = true }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVHostTime", "CVImageBuffer"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSURL", "NSUndoManager", "NSValue", "objc2-core-foundation", "std"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "SCShareableContent", "SCStream", "std"], optional = true }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
parking_lot = "0.12.1"
raw-window-handle = "0.6"
scheduler = { path = "../../zed/crates/scheduler" }
semver = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.1", features = ["serde"] }

# The macOS test-only window implementation depends on test-only APIs from both
# GPUI and the extracted renderer. A dependency does not inherit this crate's
# `cfg(test)`, so dev-dependencies enable those APIs only for test builds.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
gpui_apple = { path = "../gpui_apple", features = ["test-support"] }
