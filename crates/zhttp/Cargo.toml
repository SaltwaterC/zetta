[package]
name = "zhttp"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Standalone HTTP server, also used by Zetta server panes"

[lib]
doctest = false

[[bin]]
name = "zhttp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gethostname = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
manual_let_else = "deny"
map_unwrap_or = "deny"
redundant_closure = "deny"
semicolon_if_nothing_returned = "deny"
